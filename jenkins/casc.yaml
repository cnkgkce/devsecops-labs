jenkins:
  systemMessage: "🛡️ DevSecOps Lab: Mini Security Pipeline (SAST, SCA, Container Security & AI FP Triage)"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  numExecutors: 2
  mode: NORMAL

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >-
      pipelineJob('DevSecOps-Security-Pipeline') {
        description('DevSecOps Mini Lab: SAST (Semgrep) + SCA (Trivy fs) + Container Scan (Trivy) + AI FP Elimination')
        definition {
          cps {
            script(new File('/workspace/Jenkinsfile').text)
            sandbox(true)
          }
        }
      }
