      rpm: 14

litellm_settings:
  drop_params: true
  num_retries: 15
  retry_after: 5
  request_timeout: 120

router_settings:
  routing_strategy: "usage-based-routing"
  cooldown_time: 20
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY


