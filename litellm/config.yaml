model_list:
  # High RPM pool across 5 verified 15-RPM Gemini models
  - model_name: gpt-4o
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: gpt-4o
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: gpt-4o
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: gpt-4o
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: gpt-4o
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  # Claude Aliases
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
      rpm: 14

  - model_name: claude-3-5-sonnet-20241022
