services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: devsecops-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - CASC_JENKINS_CONFIG=/usr/share/jenkins/ref/casc.yaml
      - JENKINS_OPTS=--httpPort=8080
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/usr/share/jenkins/ref/casc.yaml:ro
      - ./:/workspace
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: devsecops-dashboard
    ports:
      - "3001:3001"
    environment:
      - WORKSPACE=/workspace
      - REPORTS_DIR=/workspace/reports
    volumes:
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Standalone Vulnerable Target App (Hedef Zafiyetli Uygulama - AI Pentester Lab)
  vulnerable-app:
    build:
      context: ./sample-app
      dockerfile: Dockerfile
    container_name: devsecops-vulnerable-app
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  jenkins_data:
